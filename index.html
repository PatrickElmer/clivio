<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clivio — Animated Terminal SVG</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="clivio.js" type="module" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
        :root {
            --pico-form-element-spacing-vertical: 0.5rem;
            --pico-form-element-spacing-horizontal: 0.4rem;
        }
        .grid input {
            margin-bottom: 5px;
        }
        .grid label {
            margin: auto 0px;
        }
        #svg-field {
            position: relative;
            width: fit-content;
        }
        #download {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            width: 2em;
            height: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #copy {
            position: absolute;
            top: 50px;
            right: 10px;
            z-index: 10;
            width: 2em;
            height: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <main class="container">
        <hgroup>
            <h1>Clivio</h1>
            <p>Paste terminal lines below to generate an animated SVG.</p>
        </hgroup>

        <div id="svg-field">
            <div id="svg-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" font-family="monospace" font-size="20px" fill="#ffffff"><rect width="100%" height="100%" rx="10" fill="#151b23"></rect><g transform="scale(1) translate(20 40)"><text y="0" opacity="0" style="user-select: none;">$ <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="24" y="0" opacity="0">l<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0294;0.0294;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="36" y="0" opacity="0">s<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0588;0.0588;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text y="25" opacity="0">Documents&nbsp;&nbsp;Downloads<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0882;0.0882;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text y="50" opacity="0" style="user-select: none;">$ <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0882;0.0882;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="24" y="50" opacity="0">e<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4118;0.4118;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="36" y="50" opacity="0">c<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4412;0.4412;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="48" y="50" opacity="0">h<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4706;0.4706;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="60" y="50" opacity="0">o<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.5;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="72" y="50" opacity="0"> <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5294;0.5294;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="84" y="50" opacity="0">H<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5588;0.5588;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="96" y="50" opacity="0">e<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5882;0.5882;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="108" y="50" opacity="0">l<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6176;0.6176;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="120" y="50" opacity="0">l<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6471;0.6471;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text x="132" y="50" opacity="0">o<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6765;0.6765;1;1" dur="3.4s" repeatCount="indefinite"></animate></text><text y="75" opacity="0">Hello<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7059;0.7059;1;1" dur="3.4s" repeatCount="indefinite"></animate></text></g></svg>
            </div>
            <button id="download" title="Download" onclick=""><i data-feather="download"></i></button>
            <button id="copy" title="Copy to clipboard"><i data-feather="copy"></i></button>
        </div>
        <hr>

        <div class="grid" style="grid-template-columns: 2fr 1fr;">
            <textarea id="lines" rows="4" style="font-family: monospace; resize: vertical;">$ ls
Documents  Downloads
$ echo Hello
Hello</textarea>
            <div style="overflow:scroll;">
                <button id="generate" style="width: 100%; margin-bottom: 10px">Animate</button>
                <fieldset class="grid" style="grid-template-columns: 3fr 2fr; --pico-grid-row-gap: 0px;">
                    <label>Speed (s)</label>
                    <input type="number" id="speed" value="0.1" step="0.1" min="0" />
                    <label>Font size (px)</label>
                    <input type="number" id="fontSize" value="20" step="1" min="8" />
                    <label>Font color</label>
                    <input type="color" id="fontColor" value="#ffffff" />
                    <label>Background</label>
                    <input type="color" id="background" value="#151b23" />
                </fieldset>
                <details>
                    <summary>Extra options</summary>
                    <fieldset class="grid" style="grid-template-columns: 3fr 2fr; --pico-grid-row-gap: 0px;">
                        <label>Pause (s)</label>
                        <input type="number" id="pause" value="1.0" step="0.1" min="0" />
                        <label>Initial pause (s)</label>
                        <input type="number" id="initialPause" value="0.0" step="0.1" min="0" />
                        <label>Width (px)</label>
                        <input type="number" id="width" value="600" step="10" min="100" />
                        <label>Padding (px)</label>
                        <input type="number" id="padding" value="20" step="1" min="0" />
                        <label>Border radius</label>
                        <input type="number" id="borderRadius" value="10" step="1" min="0" />
                        <label>Prompt</label>
                        <input type="text" id="prompt" placeholder="auto-detect" title="auto-detect" />
                    </fieldset>
                </details>
            </div>
        </div>
        <hr>
        <footer>
            <small>Made by <a href="https://pelmer.eu" target="_blank" class="primary">Patrick Elmer</a>. Sourcecode: <a href="https://github.com/PatrickElmer/clivio" target="_blank" class="primary">GitHub</a></small>
        </footer>
    </main>
</body>
</html>
